[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadsheet-automation-kit"
version = "0.1.0"
description = "Auditable cleanup and reporting for recurring spreadsheet exports"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
spreadsheet-kit = "spreadsheet_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
